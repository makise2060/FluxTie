android.enableJetifier=true
android.injected.testOnly=false
android.useAndroidX=true
kapt.verbose=true
kotlin.code.style=official
kotlin.parallel.tasks.in.project=false
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:CICompilerCount=2 -XX:+UseParallelGC -Dfile.encoding=UTF-8 \
--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.daemon=false
# org.gradle.unsafe.configuration-cache=true
# android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
#android.enableR8.fullMode=false
# R8 优化资源收缩与非 final R 不兼容，回退经典收缩
android.r8.optimizedResourceShrinking=false

# 项目路径含中文，AGP 默认拒绝构建；此处显式关闭该检查
android.overridePathCheck=true
